<!DOCTYPE html><html><head><meta charset="utf-8"><title>Ref sheet</title>
<style>
body{background:#111;color:#ddd;font:11px monospace;margin:0;padding:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
figure{margin:0}
img{width:100%;image-rendering:pixelated;border:1px solid #555;display:block}
figcaption{padding:2px 0;color:#8f8}
</style></head><body>
<div class="grid" id="g"></div>
<script>
const files = ["142301","142305","142307","142310","142312","142315","142318","142320","142323","142325","142328","142335","142340","142343","142347","142352","142403","142405","142412","142415","142417","142429"];
const g = document.getElementById('g');
for (const f of files) {
  const n = 'Screenshot_20260914_' + f + '.jpg';
  g.insertAdjacentHTML('beforeend', '<figure><img src="' + n + '"><figcaption>' + f + '</figcaption></figure>');
}
</script>
</body></html>
