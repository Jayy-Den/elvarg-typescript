<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ref zoom</title>
<style>
  body { background:#000; margin:0; }
  html, body { width:100%; height:100%; }
  #wrap { position:relative; overflow:hidden; width:100vw; height:100vh; }
  #big { image-rendering:pixelated; position:absolute; }
</style>
</head>
<body>
<div id="wrap"><img id="big"></div>
<script>
const q = new URLSearchParams(location.search);
const name = q.get("n") || "Screenshot_20260914_142310.jpg";
const scale = Number(q.get("s") || 4);
const cx = Number(q.get("cx") || 0);
const cy = Number(q.get("cy") || 0);
const img = document.getElementById("big");
img.onload = () => {
  img.style.width = (img.naturalWidth * scale) + "px";
  img.style.height = (img.naturalHeight * scale) + "px";
  img.style.left = (-cx * scale) + "px";
  img.style.top = (-cy * scale) + "px";
};
img.src = "/__refs/" + name;
</script>
</body>
</html>
