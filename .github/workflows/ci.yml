name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Newer Yarn releases ship before some bundled corepack versions know their
  # signing keys; disabling the check is the documented workaround.
  COREPACK_INTEGRITY_KEYS: 0

jobs:
  server:
    name: Server smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Enable corepack (repo-pinned Yarn 4)
        run: corepack enable
      - name: Install root + server dependencies
        run: |
          corepack yarn install --immutable
          corepack yarn --cwd server install --immutable
      - name: Restore OSRS cache (keyed on server/target.txt)
        id: osrs-cache
        uses: actions/cache@v4
        with:
          path: server/caches
          key: osrs-cache-${{ hashFiles('server/target.txt') }}
      - name: Download OSRS cache (skipped when restore validates)
        run: corepack yarn --cwd server ensure-cache
      - name: Start game server in background
        run: corepack yarn --cwd server dev &
      - name: Wait for the game server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:43594/regions > /dev/null; then
              echo "game server is up"
              exit 0
            fi
            sleep 3
          done
          echo "game server failed to start; last log lines:"
          cat logs/server-*.log 2>/dev/null | tail -50 || true
          exit 1
      - name: Run server smoke tests
        run: |
          corepack yarn --cwd server test:login
          corepack yarn --cwd server test:rejuvenation-pool
          corepack yarn --cwd server test:occult-altar
          corepack yarn --cwd server test:npc-drops
          corepack yarn --cwd server test:npc-spawns
          corepack yarn --cwd server test:cache-definitions
      - name: Start isolated dev-rights server for the shop smoke test
        run: |
          DEV_USERNAME=smoketest TCP_PORT=43596 WEBSOCKET_PORT=43595 \
            VOICE_SIGNAL_PORT=49602 DEVELOPMENT_API_PORT=49601 \
            corepack yarn --cwd server dev &
      - name: Wait for the isolated server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:43595/regions > /dev/null; then
              echo "isolated game server is up"
              exit 0
            fi
            sleep 3
          done
          echo "isolated game server failed to start; last log lines:"
          cat logs/server-*.log 2>/dev/null | tail -50 || true
          exit 1
      - name: Run shop-open smoke test
        run: |
          WEBSOCKET_PORT=43595 corepack yarn --cwd server test:shop
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: logs/
          if-no-files-found: ignore

  client:
    name: Client test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Enable corepack (repo-pinned Yarn 4)
        run: corepack enable
      - name: Install root + client dependencies
        run: |
          corepack yarn install --immutable
          corepack yarn --cwd client install --immutable
      - name: Typecheck client
        run: corepack yarn --cwd client typecheck
      - name: Run client tests
        run: corepack yarn --cwd client test
